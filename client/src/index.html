<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>Firmeza - Gestión & Comercial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('firmeza-theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="512x512" href="img/favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/favicon.png">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50 text-slate-900 antialiased">
  <app-root>Cargando Firmeza...</app-root>
</body>
</html>
