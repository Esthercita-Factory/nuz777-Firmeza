services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firmeza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - firmeza-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmeza"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${FIRMEZA_API_IMAGE:-ghcr.io/esthercita-factory/nuz777-firmeza-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=firmeza;Username=postgres;Password=postgres
      SeedAdmin__Email: admin@firmeza.local
      SeedAdmin__Password: Admin123!
      Jwt__Issuer: Firmeza.Api
      Jwt__Audience: Firmeza.Client
      Jwt__SigningKey: cambia-esta-clave-por-un-secreto-de-produccion-de-32-bytes
      Jwt__AccessTokenMinutes: 30
      Jwt__RefreshTokenDays: 7
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: ${CORS_CLIENT_ORIGIN:-http://firmeza.clandev.com}
      Cors__AllowedOrigins__1: http://localhost:8889
      Cors__AllowedOrigins__2: https://firmeza.clandev.com
      Cors__AllowedOrigins__3: http://localhost:4200
      Cors__AllowedOrigins__4: http://services.firmeza.clandev.com
      Cors__AllowedOrigins__5: https://services.firmeza.clandev.com
      Authentication__GitHub__ClientId: ${Authentication__GitHub__ClientId:-}
      Authentication__GitHub__ClientSecret: ${Authentication__GitHub__ClientSecret:-}
      Mail__FrontendBaseUrl: ${FRONTEND_BASE_URL:-https://firmeza.clandev.com}
    ports:
      - "${API_PORT:-8888}:8080"

  client:
    image: ${FIRMEZA_CLIENT_IMAGE:-ghcr.io/esthercita-factory/nuz777-firmeza-client:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${CLIENT_PORT:-8889}:80"

volumes:
  firmeza-postgres:
