services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: ${FIRMEZA_TESTS_IMAGE:-firmeza-tests:local}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firmeza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - firmeza-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmeza"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${FIRMEZA_API_IMAGE:-ghcr.io/esthercita-factory/nuz777-firmeza-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=firmeza;Username=postgres;Password=postgres
      SeedAdmin__Email: admin@firmeza.local
      SeedAdmin__Password: Admin123!
      Jwt__Issuer: Firmeza.Api
      Jwt__Audience: Firmeza.Client
      Jwt__SigningKey: cambia-esta-clave-por-un-secreto-de-produccion-de-32-bytes
      Jwt__AccessTokenMinutes: 30
      Jwt__RefreshTokenDays: 7
      Database__MigrateOnStartup: "true"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: ${CORS_CLIENT_ORIGIN:-http://localhost:8081}
    ports:
      - "8080:8080"

volumes:
  firmeza-postgres:
