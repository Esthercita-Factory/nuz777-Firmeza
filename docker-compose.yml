services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firmeza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - firmeza-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmeza"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=firmeza;Username=postgres;Password=postgres
      SeedAdmin__Email: admin@firmeza.local
      SeedAdmin__Password: Admin123!
      Https__Enabled: "false"
    ports:
      - "8080:8080"

volumes:
  firmeza-postgres:
